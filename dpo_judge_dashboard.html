<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة مراجعة حَكَم DPO — المعجم الكلاسيكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE6D3;
    --paper-deep:#E5D9BE;
    --ink:#2B241C;
    --ink-soft:#5B5142;
    --line:#C9B98F;
    --fail:#8C2F1B;
    --fail-bg:#F3E1D8;
    --pass:#3F5D42;
    --pass-bg:#E3EBDD;
    --review:#8A6A1E;
    --review-bg:#F1E6C8;
    --flag:#5C3A78;
    --flag-bg:#EADFF2;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,.25), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(0,0,0,.05), transparent 45%);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
  }
  header{
    padding:28px 32px 18px;
    border-bottom:2px solid var(--line);
  }
  header h1{
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:.5px;
  }
  header p.sub{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .stats{
    display:flex;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .stat{
    border:1px solid var(--line);
    border-radius:3px;
    padding:8px 14px;
    background:rgba(255,255,255,.35);
    font-size:13px;
    min-width:88px;
  }
  .stat b{display:block;font-size:20px;font-family:'Amiri',serif}
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    padding:16px 32px;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.2);
  }
  .toolbar input[type=search]{
    flex:1;
    min-width:200px;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper-deep);
    font-family:'Cairo',sans-serif;
    color:var(--ink);
  }
  select{
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper-deep);
    font-family:'Cairo',sans-serif;
    color:var(--ink);
  }
  .pill{
    padding:5px 12px;
    border:1px solid var(--line);
    border-radius:14px;
    font-size:12px;
    cursor:pointer;
    background:transparent;
    color:var(--ink-soft);
    user-select:none;
  }
  .pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  main{padding:22px 32px 60px; display:grid; gap:16px; max-width:980px; margin:0 auto;}
  .card{
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.25));
    border:1px solid var(--line);
    border-radius:2px;
    padding:18px 22px 16px 84px;
    box-shadow:0 1px 0 rgba(0,0,0,.05);
  }
  .stamp{
    position:absolute;
    left:14px; top:18px;
    width:60px;
    text-align:center;
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:12px;
    padding:5px 2px;
    border:2px solid;
    border-radius:4px;
    transform:rotate(-6deg);
    letter-spacing:.5px;
  }
  .stamp.FAIL{color:var(--fail);border-color:var(--fail)}
  .stamp.PASS{color:var(--pass);border-color:var(--pass)}
  .stamp.NEEDS_REVIEW{color:var(--review);border-color:var(--review)}
  .stamp.FLAG{color:var(--flag);border-color:var(--flag)}
  .card-top{
    display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  .rej-type{
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:16px;
  }
  .meta{font-size:12px;color:var(--ink-soft)}
  .conf-bar{
    height:5px; background:var(--paper-deep); border-radius:3px; margin:8px 0 12px; overflow:hidden;
    border:1px solid var(--line);
  }
  .conf-fill{height:100%; background:var(--ink-soft)}
  .texts{display:grid; grid-template-columns:1fr; gap:8px; font-family:'Amiri',serif; font-size:16px; line-height:1.9}
  .text-block{padding:10px 12px; border-radius:2px; border:1px solid var(--line)}
  .text-block.chosen{background:var(--pass-bg)}
  .text-block.rejected{background:var(--fail-bg)}
  .text-block .lbl{font-family:'Cairo',sans-serif; font-size:11px; color:var(--ink-soft); margin-bottom:4px; font-weight:600}
  details{margin-top:10px}
  summary{cursor:pointer; font-size:13px; color:var(--ink-soft); user-select:none}
  .reasons{margin:8px 0 0; padding-inline-start:18px; font-size:13.5px; line-height:1.8}
  .evidence-json{
    background:var(--ink); color:var(--paper); padding:10px 12px; border-radius:3px;
    font-size:11.5px; direction:ltr; text-align:left; overflow-x:auto; white-space:pre-wrap;
    font-family:'SFMono-Regular',Consolas,monospace;
  }
  .review-row{
    display:flex; gap:8px; align-items:center; margin-top:12px; padding-top:10px;
    border-top:1px dashed var(--line); flex-wrap:wrap;
  }
  .review-row button{
    font-family:'Cairo',sans-serif; font-size:12px; padding:6px 12px; border-radius:3px;
    border:1px solid var(--line); background:var(--paper-deep); cursor:pointer; color:var(--ink);
  }
  .review-row button.agree.active{background:var(--pass); color:#fff; border-color:var(--pass)}
  .review-row button.disagree.active{background:var(--fail); color:#fff; border-color:var(--fail)}
  .review-row .note{font-size:12px; color:var(--ink-soft)}
  .empty{padding:60px; text-align:center; color:var(--ink-soft); font-family:'Amiri',serif; font-size:18px}
</style>
</head>
<body>
<header>
  <h1>لوحة مراجعة حَكَم DPO — المعجم الكلاسيكي</h1>
  <p class="sub">مراجعة بشرية لأحكام الطبقة القاعدية/الدلالية على أزواج التفضيل. كل بطاقة = حالة واحدة (chosen/rejected) مع سبب الرفض والثقة والأدلة.</p>
  <div class="stats" id="stats"></div>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="ابحث في النص أو معرّف المصدر…">
  <select id="verdictFilter">
    <option value="">كل الأحكام</option>
    <option value="FAIL">FAIL</option>
    <option value="NEEDS_REVIEW">NEEDS_REVIEW</option>
    <option value="PASS">PASS</option>
    <option value="FLAG">أعلام جودة البيانات</option>
  </select>
  <select id="typeFilter"><option value="">كل أسباب الرفض</option></select>
  <button class="pill" id="lowConfBtn">ثقة منخفضة فقط (&lt; 0.6)</button>
</div>

<main id="cards"></main>

const TYPE_LABELS = {
  poor_instruction_following: "تجاهل التوجيه",
  wrong_formatting: "تنسيق خاطئ",
  missing_information: "نقص معلومة",
  unsupported_additions: "إضافات غير مسندة",
  wrong_register: "خلل في المستوى اللغوي",
  verbosity: "إطناب",
  weak_organization: "ضعف تنظيم",
  partial_factual_errors: "خطأ واقعي جزئي",
  less_faithful_reconstruction: "إعادة بناء غير أمينة",
  INVALID_PAIR_IDENTICAL: "⚑ الزوج متطابق (عطب بيانات)",
  SUSPECT_QUALITY_REVERSAL: "⚑ اشتباه انعكاس الجودة (عطب بيانات)",
};

function stampClass(v, type){
  if(type === "INVALID_PAIR_IDENTICAL" || type === "SUSPECT_QUALITY_REVERSAL") return "FLAG";
  return v;
}

function render(){
  const q = document.getElementById('search').value.trim();
  const vf = document.getElementById('verdictFilter').value;
  const tf = document.getElementById('typeFilter').value;
  const lowConfOnly = document.getElementById('lowConfBtn').classList.contains('active');

  let rows = DATA.filter(r => {
    if(q && !(r.chosen.includes(q) || r.rejected.includes(q) || (r.source_chunk_id||"").includes(q))) return false;
    const sc = stampClass(r.judge_verdict, r.judge_rejection_type);
    if(vf === "FLAG" && sc !== "FLAG") return false;
    if(vf && vf !== "FLAG" && r.judge_verdict !== vf) return false;
    if(tf && r.judge_rejection_type !== tf) return false;
    if(lowConfOnly && r.judge_confidence >= 0.6) return false;
    return true;
  });

  const wrap = document.getElementById('cards');
  wrap.innerHTML = "";
  if(rows.length === 0){
    wrap.innerHTML = '<div class="empty">لا توجد حالات مطابقة لعوامل التصفية.</div>';
    return;
  }

  for(const r of rows){
    const sc = stampClass(r.judge_verdict, r.judge_rejection_type);
    const card = document.createElement('div');
    card.className = 'card';
    const typeLabel = TYPE_LABELS[r.judge_rejection_type] || r.judge_rejection_type || "—";
    const pct = Math.round(r.judge_confidence * 100);

    card.innerHTML = `
      <div class="stamp ${sc}">${r.judge_verdict.replace('_','\u200b_')}</div>
      <div class="card-top">
        <div class="rej-type">${typeLabel}</div>
        <div class="meta">#${r.id} · ${r.source_chunk_id || ''} · الطبقة: ${r.judge_layer_used} · ثقة ${pct}%</div>
      </div>
      <div class="conf-bar"><div class="conf-fill" style="width:${pct}%"></div></div>
      <div class="meta" style="margin-bottom:8px">هل يُفضَّل chosen على rejected؟
        <b style="color:${r.chosen_preferred_over_rejected===true?'var(--pass)':(r.chosen_preferred_over_rejected===false?'var(--fail)':'var(--review)')}">
          ${r.chosen_preferred_over_rejected===true?'نعم':(r.chosen_preferred_over_rejected===false?'لا — الزوج مشكوك فيه':'غير محسوم')}
        </b>
      </div>
      <div class="texts">
        <div class="text-block chosen"><div class="lbl">CHOSEN (المرجع)</div>${r.chosen}</div>
        <div class="text-block rejected"><div class="lbl">REJECTED (الحالة المقيَّمة) — البيانات تُعلن: ${r.dataset_stated_rejection_type || '—'}</div>${r.rejected}</div>
      </div>
      <ul class="reasons">${r.judge_reasons.map(x=>`<li>${x}</li>`).join('')}</ul>
      <details>
        <summary>عرض الأدلة الخام (evidence)</summary>
        <div class="evidence-json">${escapeHtml(JSON.stringify(r.judge_evidence, null, 2))}</div>
      </details>
      <div class="review-row" data-id="${r.id}">
        <span class="note">مراجعة بشرية:</span>
        <button class="agree">✓ موافق على الحكم</button>
        <button class="disagree">✗ غير موافق</button>
        <span class="note review-status"></span>
      </div>
    `;
    wrap.appendChild(card);

    const agreeBtn = card.querySelector('.agree');
    const disagreeBtn = card.querySelector('.disagree');
    const statusEl = card.querySelector('.review-status');

    loadReview(r.id).then(v => paintReview(v, agreeBtn, disagreeBtn, statusEl));

    agreeBtn.onclick = async () => {
      await saveReview(r.id, 'agree');
      paintReview('agree', agreeBtn, disagreeBtn, statusEl);
    };
    disagreeBtn.onclick = async () => {
      await saveReview(r.id, 'disagree');
      paintReview('disagree', agreeBtn, disagreeBtn, statusEl);
    };
  }
}

function paintReview(v, agreeBtn, disagreeBtn, statusEl){
  agreeBtn.classList.toggle('active', v === 'agree');
  disagreeBtn.classList.toggle('active', v === 'disagree');
  statusEl.textContent = v === 'agree' ? 'سُجّلت الموافقة' : (v === 'disagree' ? 'سُجّل الاعتراض' : '');
}

async function saveReview(id, value){
  try{
    if(window.storage){
      await window.storage.set('review:' + id, value);
    }
  }catch(e){ console.error('storage error', e); }
}
async function loadReview(id){
  try{
    if(window.storage){
      const res = await window.storage.get('review:' + id);
      return res ? res.value : null;
    }
  }catch(e){ return null; }
  return null;
}

function escapeHtml(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function renderStats(){
  const total = DATA.length;
  const byVerdict = {};
  for(const r of DATA){
    const sc = stampClass(r.judge_verdict, r.judge_rejection_type);
    byVerdict[sc] = (byVerdict[sc]||0) + 1;
  }
  const flagged = DATA.filter(r => r.judge_rejection_type === 'INVALID_PAIR_IDENTICAL' || r.judge_rejection_type === 'SUSPECT_QUALITY_REVERSAL').length;
  const avgConf = (DATA.reduce((s,r)=>s+r.judge_confidence,0)/total).toFixed(2);
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat"><b>${total}</b>إجمالي الحالات</div>
    <div class="stat"><b>${byVerdict.FAIL||0}</b>FAIL</div>
    <div class="stat"><b>${byVerdict.NEEDS_REVIEW||0}</b>NEEDS_REVIEW</div>
    <div class="stat"><b>${flagged}</b>أعلام عطب بيانات</div>
    <div class="stat"><b>${avgConf}</b>متوسط الثقة</div>
  `;
}

function populateTypeFilter(){
  const sel = document.getElementById('typeFilter');
  const types = [...new Set(DATA.map(r => r.judge_rejection_type).filter(Boolean))];
  for(const t of types){
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = TYPE_LABELS[t] || t;
    sel.appendChild(opt);
  }
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('verdictFilter').addEventListener('change', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('lowConfBtn').addEventListener('click', (e) => {
  e.target.classList.toggle('active');
  render();
});

renderStats();
populateTypeFilter();
render();
</script>
</body>
</html>
